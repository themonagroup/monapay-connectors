server {
    listen 80;
    listen [::]:80;
    server_name shopify.monapay.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shopify.monapay.vn;

    ssl_certificate /etc/letsencrypt/live/shopify.monapay.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopify.monapay.vn/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    # Không parse hoặc biến đổi body: Node xác thực HMAC trên đúng raw bytes Shopify/MONA gửi.
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_pass_request_body on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }
}
